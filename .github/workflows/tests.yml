name: API checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rightmo_test_local
          MYSQL_DATABASE: rightmo_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prightmo_test_local"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rightmo_testing
      DB_USERNAME: root
      DB_PASSWORD: rightmo_test_local
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: pdo_mysql, gd, mbstring, intl, pcntl
          tools: composer:v2
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer docs
      - run: git diff --exit-code -- docs/openapi.json
      - run: composer test
      - run: php -d pcov.enabled=1 vendor/bin/pest --coverage --min=80
